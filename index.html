<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba WebRTC P2P Directa</title>
  <!-- Librería MQTT ligera para señalización P2P vía HTTPS/WSS (Sin registro) -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 20px auto; padding: 15px; background: #f4f6f9; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    input, button { padding: 12px; margin: 6px 0; width: 100%; box-sizing: border-box; font-size: 15px; border-radius: 6px; }
    input { border: 1px solid #ccc; }
    button { border: none; font-weight: bold; cursor: pointer; color: white; }
    .btn-host { background-color: #28a745; }
    .btn-client { background-color: #007bff; }
    .btn-send { background-color: #6c757d; }
    #log { background: #1e1e1e; color: #33ff33; padding: 12px; height: 220px; overflow-y: auto; font-family: monospace; font-size: 12px; margin-top: 15px; border-radius: 6px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Prueba WebRTC P2P Directa</h2>
    
    <div>
      <label><b>Código de 4 dígitos:</b></label>
      <input type="text" id="code" value="4921" maxlength="4">
      
      <button class="btn-host" onclick="startHost()">1. Crear Sala (Host)</button>
      <button class="btn-client" onclick="startClient()">2. Unirse a Sala (Cliente)</button>
    </div>

    <div id="chat" style="display:none; margin-top:15px;">
      <hr>
      <input type="text" id="msgInput" placeholder="Escribe un mensaje P2P...">
      <button class="btn-send" onclick="sendMessage()">Enviar Mensaje Directo</button>
    </div>

    <h3>Log de Eventos:</h3>
    <div id="log"></div>
  </div>

  <script>
    let mqttClient = null;
    let pc = null;
    let dataChannel = null;
    let roomCode = "";

    // Servidores STUN públicos de Google para atravesar NATs / Routers
    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    };

    function log(txt) {
      const logDiv = document.getElementById('log');
      logDiv.innerHTML += `> ${txt}<br>`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    // MODO HOST (Gafa A / PC)
    function startHost() {
      roomCode = document.getElementById('code').value.trim();
      log(`Iniciando Host en la sala [${roomCode}]...`);

      // Conexión al servidor de señalización por WebSocket Seguro (WSS)
      mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

      mqttClient.on('connect', () => {
        log("Conectado al bus de señalización. Esperando cliente...");
        mqttClient.subscribe(`upv/vr/${roomCode}/join`);
        mqttClient.subscribe(`upv/vr/${roomCode}/answer`);
        mqttClient.subscribe(`upv/vr/${roomCode}/candidate_client`);
      });

      mqttClient.on('message', async (topic, message) => {
        const payload = JSON.parse(message.toString());

        if (topic === `upv/vr/${roomCode}/join`) {
          log("Cliente detectado. Creando oferta WebRTC...");
          createHostOffer();
        } else if (topic === `upv/vr/${roomCode}/answer`) {
          log("Respuesta SDP recibida del cliente. Estableciendo túnel P2P...");
          await pc.setRemoteDescription(new RTCSessionDescription(payload));
        } else if (topic === `upv/vr/${roomCode}/candidate_client`) {
          if (pc && payload) {
            await pc.addIceCandidate(new RTCIceCandidate(payload));
          }
        }
      });
    }

    async function createHostOffer() {
      pc = new RTCPeerConnection(rtcConfig);
      dataChannel = pc.createDataChannel("VRData");
      setupDataChannelEvents();

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          mqttClient.publish(`upv/vr/${roomCode}/candidate_host`, JSON.stringify(event.candidate));
        }
      };

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      mqttClient.publish(`upv/vr/${roomCode}/offer`, JSON.stringify(offer));
    }

    // MODO CLIENTE (Gafa B / Móvil)
    function startClient() {
      roomCode = document.getElementById('code').value.trim();
      log(`Buscando la sala [${roomCode}]...`);

      mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

      mqttClient.on('connect', () => {
        log("Conectado a la red. Solicitando unirse al Host...");
        mqttClient.subscribe(`upv/vr/${roomCode}/offer`);
        mqttClient.subscribe(`upv/vr/${roomCode}/candidate_host`);
        
        // Notificar al Host que se ha unido un cliente
        mqttClient.publish(`upv/vr/${roomCode}/join`, JSON.stringify({ action: 'join' }));
      });

      mqttClient.on('message', async (topic, message) => {
        const payload = JSON.parse(message.toString());

        if (topic === `upv/vr/${roomCode}/offer`) {
          log("Oferta del Host recibida. Procesando...");
          handleOfferAndAnswer(payload);
        } else if (topic === `upv/vr/${roomCode}/candidate_host`) {
          if (pc && payload) {
            await pc.addIceCandidate(new RTCIceCandidate(payload));
          }
        }
      });
    }

    async function handleOfferAndAnswer(offer) {
      pc = new RTCPeerConnection(rtcConfig);

      pc.ondatachannel = (event) => {
        dataChannel = event.channel;
        setupDataChannelEvents();
      };

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          mqttClient.publish(`upv/vr/${roomCode}/candidate_client`, JSON.stringify(event.candidate));
        }
      };

      await pc.setRemoteDescription(new RTCSessionDescription(offer));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);

      mqttClient.publish(`upv/vr/${roomCode}/answer`, JSON.stringify(answer));
    }

    function setupDataChannelEvents() {
      dataChannel.onopen = () => {
        log("<b style='color:#00ff00'>¡ENLACE WEBRTC P2P CONECTADO!</b>");
        log("Servidores de señalización desconectados. Comunicación 100% directa.");
        document.getElementById('chat').style.display = 'block';
      };

      dataChannel.onmessage = (e) => {
        log(`<span style='color:#00ffff'><b>Recibido P2P:</b> ${e.data}</span>`);
      };
    }

    function sendMessage() {
      const input = document.getElementById('msgInput');
      if (dataChannel && dataChannel.readyState === 'open' && input.value.trim() !== '') {
        dataChannel.send(input.value);
        log(`<b>Enviado P2P:</b> ${input.value}`);
        input.value = '';
      }
    }
  </script>
</body>
</html>
