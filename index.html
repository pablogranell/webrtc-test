<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba WebRTC - Bypass UPVNET (TURN)</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 20px auto; padding: 15px; background: #f4f6f9; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    input, button { padding: 12px; margin: 6px 0; width: 100%; box-sizing: border-box; font-size: 15px; border-radius: 6px; }
    input { border: 1px solid #ccc; }
    button { border: none; font-weight: bold; cursor: pointer; color: white; }
    .btn-host { background-color: #28a745; }
    .btn-client { background-color: #007bff; }
    .btn-send { background-color: #6c757d; }
    #log { background: #1e1e1e; color: #33ff33; padding: 12px; height: 250px; overflow-y: auto; font-family: monospace; font-size: 12px; margin-top: 15px; border-radius: 6px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Prueba WebRTC (Bypass Red Estricta)</h2>
    
    <div>
      <label><b>Código de 4 dígitos:</b></label>
      <input type="text" id="code" value="4921" maxlength="4">
      
      <button class="btn-host" onclick="startHost()">1. Crear Sala (Host)</button>
      <button class="btn-client" onclick="startClient()">2. Unirse a Sala (Cliente)</button>
    </div>

    <div id="chat" style="display:none; margin-top:15px;">
      <hr>
      <input type="text" id="msgInput" placeholder="Escribe un mensaje P2P...">
      <button class="btn-send" onclick="sendMessage()">Enviar Mensaje</button>
    </div>

    <h3>Log de Eventos (Estado de Red):</h3>
    <div id="log"></div>
  </div>

  <script>
    const myId = Math.random().toString(36).substring(7);
    let mqttClient = null;
    let pc = null;
    let dataChannel = null;
    let roomCode = "";
    let iceCandidatesQueue = [];

    // STUN para redes normales y TURN (OpenRelay) para saltar firewalls como UPVNET
    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        {
          urls: [
            "turn:openrelay.metered.ca:80",
            "turn:openrelay.metered.ca:443",
            "turn:openrelay.metered.ca:443?transport=tcp"
          ],
          username: "openrelayproject",
          credential: "openrelayproject"
        }
      ]
    };

    function log(txt) {
      const logDiv = document.getElementById('log');
      logDiv.innerHTML += `> ${txt}<br>`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function monitorIceState() {
      pc.oniceconnectionstatechange = () => {
        const state = pc.iceConnectionState;
        log(`<span style="color:#ffeb3b">Estado del túnel de red: <b>${state.toUpperCase()}</b></span>`);
        
        if (state === 'failed') {
          log("<span style='color:#ff6b6b'><b>ERROR:</b> Ni siquiera el servidor TURN pudo saltar el bloqueo.</span>");
        } else if (state === 'connected' || state === 'completed') {
          log("<span style='color:#00ffff'>Ruta encontrada con éxito (Posiblemente usando TURN).</span>");
        }
      };
    }

    function startHost() {
      roomCode = document.getElementById('code').value.trim();
      log(`Iniciando Host... [ID: ${myId}]`);

      mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
      mqttClient.on('connect', () => {
        log("Conectado a red MQTT.");
        mqttClient.subscribe(`upv/vr/${roomCode}/join`);
        mqttClient.subscribe(`upv/vr/${roomCode}/answer`);
        mqttClient.subscribe(`upv/vr/${roomCode}/candidate_client`);
      });

      mqttClient.on('message', async (topic, message) => {
        const payload = JSON.parse(message.toString());
        if (payload.sender === myId) return;

        if (topic === `upv/vr/${roomCode}/join` && !pc) {
          log("Cliente detectado. Configurando WebRTC con TURN...");
          createHostOffer();
        } else if (topic === `upv/vr/${roomCode}/answer` && pc && !pc.currentRemoteDescription) {
          log("Respuesta obtenida. Negociando ruta de red...");
          await pc.setRemoteDescription(new RTCSessionDescription(payload.sdp));
          processIceQueue();
        } else if (topic === `upv/vr/${roomCode}/candidate_client`) {
          handleReceivedCandidate(payload.candidate);
        }
      });
    }

    async function createHostOffer() {
      pc = new RTCPeerConnection(rtcConfig);
      monitorIceState();
      
      dataChannel = pc.createDataChannel("VRData");
      setupDataChannelEvents();

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          mqttClient.publish(`upv/vr/${roomCode}/candidate_host`, JSON.stringify({ sender: myId, candidate: event.candidate }));
        }
      };

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      mqttClient.publish(`upv/vr/${roomCode}/offer`, JSON.stringify({ sender: myId, sdp: offer }));
    }

    function startClient() {
      roomCode = document.getElementById('code').value.trim();
      log(`Iniciando Cliente... [ID: ${myId}]`);

      mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
      mqttClient.on('connect', () => {
        log("Conectado a red MQTT. Solicitando unirse...");
        mqttClient.subscribe(`upv/vr/${roomCode}/offer`);
        mqttClient.subscribe(`upv/vr/${roomCode}/candidate_host`);
        mqttClient.publish(`upv/vr/${roomCode}/join`, JSON.stringify({ sender: myId }));
      });

      mqttClient.on('message', async (topic, message) => {
        const payload = JSON.parse(message.toString());
        if (payload.sender === myId) return;

        if (topic === `upv/vr/${roomCode}/offer` && !pc) {
          log("Oferta del Host recibida.");
          handleOfferAndAnswer(payload.sdp);
        } else if (topic === `upv/vr/${roomCode}/candidate_host`) {
          handleReceivedCandidate(payload.candidate);
        }
      });
    }

    async function handleOfferAndAnswer(offer) {
      pc = new RTCPeerConnection(rtcConfig);
      monitorIceState();

      pc.ondatachannel = (event) => {
        dataChannel = event.channel;
        setupDataChannelEvents();
      };

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          mqttClient.publish(`upv/vr/${roomCode}/candidate_client`, JSON.stringify({ sender: myId, candidate: event.candidate }));
        }
      };

      await pc.setRemoteDescription(new RTCSessionDescription(offer));
      processIceQueue();

      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      mqttClient.publish(`upv/vr/${roomCode}/answer`, JSON.stringify({ sender: myId, sdp: answer }));
    }

    async function handleReceivedCandidate(candidate) {
      if (pc && pc.remoteDescription) {
        await pc.addIceCandidate(new RTCIceCandidate(candidate)).catch(e => log(`Error ICE: ${e}`));
      } else {
        iceCandidatesQueue.push(candidate);
      }
    }

    async function processIceQueue() {
      while (iceCandidatesQueue.length > 0) {
        const candidate = iceCandidatesQueue.shift();
        await pc.addIceCandidate(new RTCIceCandidate(candidate)).catch(e => log(`Error ICE Queue: ${e}`));
      }
    }

    function setupDataChannelEvents() {
      dataChannel.onopen = () => {
        log("<b style='color:#00ff00'>¡ENLACE WEBRTC P2P ESTABLECIDO!</b>");
        document.getElementById('chat').style.display = 'block';
      };
      dataChannel.onmessage = (e) => {
        log(`<span style='color:#00ffff'><b>Recibido P2P:</b> ${e.data}</span>`);
      };
    }

    function sendMessage() {
      const input = document.getElementById('msgInput');
      if (dataChannel && dataChannel.readyState === 'open' && input.value.trim() !== '') {
        dataChannel.send(input.value);
        log(`<b>Enviado:</b> ${input.value}`);
        input.value = '';
      }
    }
  </script>
</body>
</html>
