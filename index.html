<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat WebRTC P2P</title>
<style>
  :root{
    --bg:#0b1020; --card:#151c30; --border:#2a3554;
    --text:#e6ebf5; --muted:#8b97b3; --acc:#3b82f6;
    --ok:#22c55e; --bad:#ef4444;
  }
  *{box-sizing:border-box}
  body{margin:0 auto;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);padding:16px;max-width:640px}
  h1{font-size:1.3rem;margin:8px 0}
  .pill{display:inline-block;padding:4px 12px;border-radius:999px;font-size:.85rem;border:1px solid var(--border);color:var(--muted);margin-bottom:12px}
  .pill.ok{background:rgba(34,197,94,.15);border-color:var(--ok);color:var(--ok)}
  .pill.err{background:rgba(239,68,68,.15);border-color:var(--bad);color:var(--bad)}
  .card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:12px}
  .card h3{margin:0 0 8px;font-size:.95rem;color:var(--muted);font-weight:600}
  button{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:10px 16px;font-size:.95rem;cursor:pointer;width:100%}
  button.ghost{background:transparent;border:1px solid var(--border);color:var(--text);font-size:.8rem;padding:6px 10px;width:auto}
  textarea{width:100%;min-height:70px;background:#0b1120;border:1px solid var(--border);border-radius:6px;color:var(--text);padding:8px;font-size:.75rem;font-family:monospace;resize:vertical}
  .row{display:flex;gap:8px;margin-top:8px}
  .hidden{display:none}
  .muted{color:var(--muted);font-size:.8rem}
  #chat{height:280px;overflow-y:auto;background:#0b1120;border:1px solid var(--border);border-radius:6px;padding:10px;font-size:.95rem;margin-bottom:8px}
  .msg{margin-bottom:8px;max-width:80%;padding:6px 10px;border-radius:10px;word-break:break-word}
  .msg.me{margin-left:auto;background:#1d4ed8;color:#fff}
  .msg.them{background:#26324f}
  .msg.sys{margin:0 auto;background:transparent;color:var(--muted);font-size:.8rem;text-align:center}
  input[type=text]{flex:1;background:#0b1120;border:1px solid var(--border);border-radius:6px;color:var(--text);padding:10px;font-size:.95rem}
</style>
</head>
<body>

<h1>Chat WebRTC P2P</h1>
<div class="pill" id="status">Estado: no iniciado</div>

<div class="card" id="chatCard">
  <h3>Mensajes</h3>
  <div id="chat"><div class="msg sys">Conéctate para empezar a chatear.</div></div>
  <div class="row">
    <input type="text" id="chatIn" placeholder="Escribe un mensaje..." disabled>
    <button id="btnSend" disabled>Enviar</button>
  </div>
</div>

<div class="card">
  <h3>Dispositivo A (anfitrión)</h3>
  <button id="btnOffer">1. Generar código de invitación</button>
  <div class="row hidden" id="offerOutWrap">
    <textarea id="offerOut" readonly placeholder="Tu código de invitación"></textarea>
    <button id="copyOffer" class="ghost" style="align-self:flex-start">Copiar</button>
  </div>
  <div class="row hidden" id="answerInWrap">
    <textarea id="answerIn" placeholder="Pega aquí la respuesta del dispositivo B"></textarea>
  </div>
  <div class="row hidden" id="confirmWrap">
    <button id="btnConfirm">4. Confirmar conexión</button>
  </div>
</div>

<div class="card">
  <h3>Dispositivo B (invitado)</h3>
  <textarea id="offerIn" placeholder="Pega aquí el código de invitación del dispositivo A"></textarea>
  <div class="row">
    <button id="btnAnswer">3. Crear respuesta</button>
  </div>
  <div class="row hidden" id="answerOutWrap">
    <textarea id="answerOut" readonly placeholder="Tu código de respuesta"></textarea>
    <button id="copyAnswer" class="ghost" style="align-self:flex-start">Copiar</button>
  </div>
</div>

<div class="card">
  <span class="muted" id="meta">ICE: — | RTT: —</span>
  <div class="row">
    <button id="btnReset" class="ghost" style="align-self:flex-start">Reiniciar (recarga)</button>
  </div>
  <p class="muted">Señalización manual (copiar/pegar) y STUN público. El chat viaja directamente entre los dos dispositivos.</p>
</div>

<script>
const $ = id => document.getElementById(id);
const statusEl = $('status'), metaEl = $('meta'), chatEl = $('chat');

let pc = null, dc = null, pingTimer = null;

const RTCConfig = { iceServers: [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun1.l.google.com:19302' },
  { urls: 'stun2.l.google.com:19302' },
  { urls: 'stun3.l.google.com:19302' },
  { urls: 'stun:global.stun.twilio.com:3478' }
]};

function setStatus(txt, cls){ statusEl.textContent = 'Estado: ' + txt; statusEl.className = 'pill' + (cls ? ' ' + cls : ''); }
function updateMeta(){ metaEl.textContent = `ICE: ${pc ? pc.iceConnectionState : '—'} | RTT: ${window._rtt ?? '—'}`; }

const enc = d => btoa(unescape(encodeURIComponent(JSON.stringify(d))));
const dec = s => { try { return JSON.parse(decodeURIComponent(escape(atob(s.trim())))); } catch(e){ throw new Error('Código no válido'); } };

function waitGathering(timeout = 4000){
  return new Promise(res => {
    if (!pc || pc.iceGatheringState === 'complete') return res();
    const t = setTimeout(res, timeout);
    const iv = setInterval(() => {
      if (pc.iceGatheringState === 'complete') { clearTimeout(t); clearInterval(iv); res(); }
    }, 100);
  });
}

function addMsg(text, cls){
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function setupDC(channel){
  dc = channel;
  dc.onopen = () => {
    $('chatIn').disabled = false;
    $('btnSend').disabled = false;
    addMsg('Conectado. El canal P2P está abierto.', 'sys');
    setStatus('conectado (P2P)', 'ok');
    if (!pingTimer) pingTimer = setInterval(() => {
      if (dc && dc.readyState === 'open') dc.send(JSON.stringify({ t: 'ping', ts: Date.now() }));
    }, 1000);
  };
  dc.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.t === 'ping') dc.send(JSON.stringify({ t: 'pong', ts: m.ts }));
    else if (m.t === 'pong') { window._rtt = (Date.now() - m.ts) + ' ms'; updateMeta(); }
    else if (m.t === 'chat') addMsg(m.msg, 'them');
  };
  dc.onclose = () => setStatus('canal de datos cerrado', 'err');
}

async function gatherAndPublish(out){
  await waitGathering();
  out.value = enc(pc.localDescription);
  out.parentElement.classList.remove('hidden');
  updateMeta();
}

function newPC(){
  pc = new RTCPeerConnection(RTCConfig);
  pc.oniceconnectionstatechange = () => {
    if (!pc) return;
    const s = pc.iceConnectionState;
    if (s === 'connected' || s === 'completed') setStatus('conectado (P2P)', 'ok');
    else if (s === 'failed') setStatus('falló la conexión ICE', 'err');
    else if (s === 'disconnected') setStatus('desconectado', 'err');
    updateMeta();
  };
  setupDC(pc.createDataChannel('chat'));
}

$('btnOffer').onclick = async () => {
  try {
    newPC();
    await pc.setLocalDescription(await pc.createOffer());
    await gatherAndPublish($('offerOut'));
    $('answerInWrap').classList.remove('hidden');
    $('confirmWrap').classList.remove('hidden');
    setStatus('invitación generada, compártela con el dispositivo B', 'ok');
  } catch(e){ setStatus('error al crear la oferta: ' + e.message, 'err'); }
};

$('btnAnswer').onclick = async () => {
  try {
    pc = new RTCPeerConnection(RTCConfig);
    pc.oniceconnectionstatechange = () => {
      if (!pc) return;
      const s = pc.iceConnectionState;
      if (s === 'connected' || s === 'completed') setStatus('conectado (P2P)', 'ok');
      else if (s === 'failed') setStatus('falló la conexión ICE', 'err');
      else if (s === 'disconnected') setStatus('desconectado', 'err');
      updateMeta();
    };
    pc.ondatachannel = e => setupDC(e.channel);
    await pc.setRemoteDescription(dec($('offerIn').value));
    await pc.setLocalDescription(await pc.createAnswer());
    await gatherAndPublish($('answerOut'));
    setStatus('respuesta creada, envíala al dispositivo A (la conexión puede establecerse ya)', 'ok');
  } catch(e){ setStatus('error al crear la respuesta: ' + e.message, 'err'); }
};

$('btnConfirm').onclick = async () => {
  try {
    if (!pc) return setStatus('genera primero el código de invitación', 'err');
    await pc.setRemoteDescription(dec($('answerIn').value));
    setStatus('esperando conexión ICE...', '');
  } catch(e){ setStatus('error al confirmar: ' + e.message, 'err'); }
};

function sendChat(){
  const v = $('chatIn').value.trim();
  if (!v || !dc || dc.readyState !== 'open') return;
  dc.send(JSON.stringify({ t: 'chat', msg: v }));
  addMsg(v, 'me');
  $('chatIn').value = '';
  $('chatIn').focus();
}
$('btnSend').onclick = sendChat;
$('chatIn').addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });

async function copyText(btn, area){
  try { await navigator.clipboard.writeText(area.value); }
  catch { area.select(); document.execCommand('copy'); }
  btn.textContent = 'Copiado';
  setTimeout(() => btn.textContent = 'Copiar', 1200);
}
$('copyOffer').onclick = e => copyText(e.target, $('offerOut'));
$('copyAnswer').onclick = e => copyText(e.target, $('answerOut'));

$('btnReset').onclick = () => location.reload();
setInterval(updateMeta, 2000);
</script>
</body>
</html>
